[project]
name = "gh-wrapper"
version = "0.1.0"
description = "A Pythonic wrapper around the GitHub CLI (gh), optimized for AI agents and automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "python-dateutil>=2.8.0",
]
authors = [
    { name = "Mohamed Ahmed Hamed" }
]

keywords = [
    "github",
    "gh",
    "cli",
    "automation",
    "ai-agents",
    "enterprise",
    "sso",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.14.10",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "faker>=20.0.0",
]
fancy = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/MohamedHamed19m/gh-bridge"
Repository = "https://github.com/MohamedHamed19m/gh-bridge"
Issues = "https://github.com/MohamedHamed19m/gh-bridge/issues"


[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: requires authenticated gh CLI session",
]
addopts = [
    "--cov=src/gh_wrapper",
    "--cov-report=term-missing",
]



[tool.ruff]
line-length = 88
fix = true
exclude = [".venv", ".trees", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
