repos:
  # 1️⃣ Ruff: linting, formatting, type hints
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.261  # latest ruff-pre-commit version
    hooks:
      - id: ruff
        args: ["--fix"]  # automatically fix fixable issues
        additional_dependencies:
          - ruff==0.0.261  # ensure version matches

  # 2️⃣ Mypy: static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^src/|^tests/
        args: ["--explicit-package-bases"]
        additional_dependencies:
          - types-requests

  # 3️⃣ Black: code formatting
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3  

  # 4️⃣ Isort: optional import sorting
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
